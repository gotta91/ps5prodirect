name: Controllo PS5 Pro

on:
  schedule:
    - cron: "3-58/5 * * * *"   # ogni 5 minuti (minimo consentito)
  workflow_dispatch:         # permette di lanciarlo a mano per provarlo

permissions:
  contents: write            # serve per salvare state.txt

concurrency:
  group: ps5-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Controlla disponibilità
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_ps5.py

      - name: Salva stato se cambiato
        run: |
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add state.txt
            git commit -m "stato PS5 Pro aggiornato"
            git push
          fi
